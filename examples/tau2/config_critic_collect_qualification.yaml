defaults:
  - config_sao_qualification
  - _self_

# One lr=0 optimizer step is used only to drive the normal proxy/export path.
# The actor weights must remain byte-equivalent after collection.
experiment_name: tau2-critic-collect-qualification
trial_name: ${oc.env:TAU2_TRIAL_NAME,tau2-critic-collect}
algorithm: collect
train_batch_episodes: 6
effective_episodes: 6
domain_effective_episodes: {airline: 2, retail: 2, telecom: 2}
total_train_steps: 1
critic_updates_before_actor: 0

rollout:
  queue_size: 12

actor:
  optimizer:
    lr: 0.0
  mb_spec:
    n_mbs: 2
  gae_lambda: 1.0
  gae_lambda_kwargs: {}
  critic_gae_lambda: null
  use_direct_dis_loss: false

critic: null

train_dataset:
  batch_size: 6

saver:
  freq_steps: 1
  freq_epochs: 1

recover:
  mode: disabled
  freq_steps: 1
  freq_epochs: 1
