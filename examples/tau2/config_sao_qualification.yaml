# Qualification-only: three tool-use episodes, two critic updates, one actor update.
experiment_name: tau2-sao-qualification
trial_name: ${oc.env:TAU2_TRIAL_NAME,tau2-sao-one-step}
seed: 42
enable_offload: true
total_train_epochs: 1
total_train_steps: 1
num_critic_only_steps: 0
critic_updates_before_actor: 2
algorithm: sao
domains: [airline, retail, telecom]
train_batch_episodes: 3
effective_episodes: 3
domain_effective_episodes: {airline: 1, retail: 1, telecom: 1}
dynamic_group_filter: false
episode_timeout_seconds: 600
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ${oc.env:TAU2_RUN_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/name-resolve

scheduler:
  type: local

rollout:
  backend: sglang:d5p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 1
  queue_size: 6
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: true
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  agent:
    mode: inline
    tool_call_parser: qwen3_coder
    reasoning_parser: qwen3
    chat_template_type: concat
    engine_max_tokens: 32768
    export_style: concat
    turn_discount: 1.0

gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 4096
  max_tokens: 32768
  greedy: false
  temperature: 1.0
  top_p: 1.0
  top_k: 100000000
  frequency_penalty: 0.0
  seed: 42
  reward_normalization: false
  drop_incomplete_group: false

eval_gconfig: null

actor:
  backend: fsdp:d3p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:TAU2_ACTOR_PATH}
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  optimizer_dtype: float32
  attn_impl: flash_attention_2
  mb_spec:
    n_mbs: 1
    max_tokens_per_mb: 32768
  fsdp:
    offload_params: false
    per_layer_optim_step: false
  optimizer:
    type: adam
    lr: 1.0e-06
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
    warmup_steps: 0
  temperature: 1.0
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  loss_reduction: token_mean
  recompute_logprob: false
  use_decoupled_loss: false
  rejection_sampling: null
  reward_norm: null
  adv_norm: null
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  discount: 1.0
  gae_lambda: areal.trainer.ppo.lambda_fn.sao_length_adaptive_gae
  gae_lambda_kwargs: {alpha: 1.5}
  critic_gae_lambda: 1.0
  use_direct_dis_loss: true
  dis_epsilon_low: 0.3
  dis_epsilon_high: 5.0
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 2
      mem: 64
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

critic:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:TAU2_CRITIC_PATH}
  is_critic: true
  freeze_critic_attention: false
  value_contract: null
  init_from_scratch: false
  offload: true
  dtype: ${actor.dtype}
  optimizer_dtype: ${actor.optimizer_dtype}
  attn_impl: ${actor.attn_impl}
  disable_dropout: true
  gradient_checkpointing: true
  ppo_n_minibatches: 1
  loss_reduction: token_mean
  eps_clip: null
  mb_spec:
    n_mbs: 1
    max_tokens_per_mb: 32768
  fsdp:
    offload_params: false
    per_layer_optim_step: false
  optimizer:
    type: adam
    lr: 5.0e-06
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
    warmup_steps: 0
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

ref: null
teacher: null

sglang:
  attention_backend: flashinfer
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: 1
  context_length: 32768
  mem_fraction_static: 0.75
  disable_cuda_graph: false
  disable_overlap_schedule: false
  disable_radix_cache: true
  chunked_prefill_size: -1

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  gpu_memory_utilization: 0.8

econfig:
  domain: mixed
  max_steps: 50
  add_thinking_tool: false
  enable_thinking: false
  context_window_tokens: 32768
  max_completion_tokens: 4096
  solo_mode: false
  user_llm_base_url: https://api.deepseek.com
  user_llm: deepseek-flash
  user_llm_api_key_env: DEEPSEEK_API_KEY
  user_llm_num_retries: 3
  user_llm_args:
    temperature: 0.0
    max_completion_tokens: 512
  turn_discount: 1.0
  invalid_format_penalty: 0.0

train_dataset:
  scheduling_spec: null
  batch_size: 3
  shuffle: false
  pin_memory: true
  num_workers: 0
  path: tau2/train
  split: train
  type: rl
  max_length: 32768
  drop_last: false

valid_dataset: null

saver:
  mode: sync
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 1
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 1
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null
  eval_before_train: false

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb: {mode: disabled}
  swanlab: {mode: disabled}
  trackio: {mode: disabled}

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: true
  save_interval: 1
  profile_steps: [0]
  session_tracer: {enabled: true, flush_threshold: 1}
