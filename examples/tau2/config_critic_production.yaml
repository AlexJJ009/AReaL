# Production online critic fit: 178 official train tasks over two epochs,
# 24 critic-only updates, fixed actor, fixed 100-task official test eval.
experiment_name: tau2-critic-production
trial_name: ${oc.env:TAU2_TRIAL_NAME,tau2-critic-production}
seed: 42
enable_offload: true
total_train_epochs: 2
total_train_steps: null
num_critic_only_steps: 0
critic_updates_before_actor: 0
algorithm: critic
experiment_mode: formal
domains: [airline, retail, telecom]
train_batch_episodes: 16
effective_episodes: null
domain_effective_episodes: {}
dynamic_group_filter: false
critic_dev_fraction: 0.2
critic_tasks_per_domain: null
critic_rollouts_per_task: 1
infra_retries: 1
episode_timeout_seconds: 600
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ${oc.env:TAU2_RUN_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/name-resolve

scheduler:
  type: local

rollout:
  backend: sglang:d4p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 16
  queue_size: 32
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: true
  deterministic_sampling: true
  scheduling_strategy:
    type: separation
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  agent:
    mode: inline
    tool_call_parser: qwen3_coder
    reasoning_parser: qwen3
    chat_template_type: concat
    engine_max_tokens: 32768
    export_style: concat
    prefix_matcher: examples.tau2.contracts.tau2_qwen_concat_prefix_matcher
    turn_discount: 1.0

gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 4096
  max_tokens: 32768
  greedy: false
  temperature: 1.0
  top_p: 1.0
  top_k: 100000000
  frequency_penalty: 0.0
  seed: null
  reward_normalization: false
  drop_incomplete_group: false

eval_gconfig: null

actor:
  backend: fsdp:d4p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:TAU2_ACTOR_PATH,Qwen/Qwen3.5-4B@851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a}
  init_from_scratch: false
  offload: true
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  optimizer_dtype: float32
  grad_reduce_dtype: float32
  attn_impl: flash_attention_2
  mb_spec:
    n_mbs: 1
    max_tokens_per_mb: 32768
    packing_algorithm: ffd
  fsdp:
    offload_params: false
    per_layer_optim_step: false
  optimizer:
    type: adam
    lr: 0.0
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
    warmup_steps: 0
  temperature: ${gconfig.temperature}
  eps_clip: 0.2
  eps_clip_higher: null
  reward_scaling: 1.0
  reward_bias: 0.0
  reward_norm: null
  adv_norm: null
  kl_ctl: 0.0
  overlong_reward_penalty: false
  ppo_n_minibatches: 1
  loss_reduction: token_mean
  recompute_logprob: false
  use_decoupled_loss: false
  rejection_sampling: null
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  discount: 1.0
  gae_lambda: 1.0
  gae_lambda_kwargs: {}
  critic_gae_lambda: 1.0
  use_direct_dis_loss: false
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 2
      mem: 64
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

critic:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  is_critic: true
  freeze_critic_attention: true
  value_contract: null
  init_from_scratch: false
  offload: true
  dtype: ${actor.dtype}
  optimizer_dtype: ${actor.optimizer_dtype}
  grad_reduce_dtype: ${actor.grad_reduce_dtype}
  attn_impl: ${actor.attn_impl}
  disable_dropout: true
  gradient_checkpointing: true
  ppo_n_minibatches: 1
  loss_reduction: token_mean
  eps_clip: null
  mb_spec:
    n_mbs: 1
    max_tokens_per_mb: 32768
    packing_algorithm: ffd
  fsdp:
    offload_params: false
    per_layer_optim_step: false
  optimizer:
    type: adam
    lr: 5.0e-06
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
    warmup_steps: 0
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

ref: null
teacher: null

sglang:
  attention_backend: flashinfer
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: 4
  context_length: 32768
  mem_fraction_static: 0.65
  disable_cuda_graph: false
  disable_overlap_schedule: false
  disable_radix_cache: true
  chunked_prefill_size: -1
  log_level: info

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  gpu_memory_utilization: 0.8

econfig:
  domain: mixed
  max_steps: 50
  add_thinking_tool: false
  enable_thinking: false
  context_window_tokens: 32768
  max_completion_tokens: 4096
  solo_mode: false
  user_llm_base_url: https://api.deepseek.com
  user_llm: deepseek-flash
  user_llm_api_key_env: DEEPSEEK_API_KEY
  user_llm_num_retries: 3
  user_llm_args:
    temperature: 0.0
    max_completion_tokens: 512
  turn_discount: 1.0
  invalid_format_penalty: 0.0

train_dataset:
  scheduling_spec: null
  batch_size: 16
  shuffle: false
  pin_memory: true
  num_workers: 0
  path: tau2/train
  split: train
  type: rl
  max_length: 32768
  drop_last: false

valid_dataset: null

saver:
  mode: sync
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 5
  freq_secs: null

recover:
  mode: auto
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 5
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 5
  freq_secs: null
  eval_before_train: false

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb: {mode: disabled}
  swanlab: {mode: disabled}
  trackio: {mode: disabled}

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: true
  save_interval: 5
  profile_steps: []
  session_tracer: {enabled: true, flush_threshold: 1}
