# Qualification-only offline replay: three train episodes, one critic update.
experiment_name: tau2-critic-qualification
trial_name: ${oc.env:TAU2_TRIAL_NAME,tau2-critic-one-update}
seed: 42
enable_offload: false
total_train_epochs: 1
total_train_steps: 1
num_critic_only_steps: 1
critic_updates_before_actor: 0
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ${oc.env:TAU2_RUN_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/name-resolve
scheduler: {type: local}

rollout:
  backend: sglang:d5p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 1
  queue_size: 6
  consumer_batch_size: 3
  max_head_offpolicyness: 0
  enable_rollout_tracing: true
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: false

gconfig:
  n_samples: 1
  max_new_tokens: 4096
  max_tokens: 32768
  greedy: false
  temperature: 1.0
  top_p: 1.0
  top_k: 100000000
  frequency_penalty: 0.0
  seed: 42
  reward_normalization: false
eval_gconfig: null

actor:
  backend: fsdp:d3p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:TAU2_ACTOR_PATH}
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  optimizer_dtype: float32
  attn_impl: flash_attention_2
  mb_spec: {n_mbs: 1, max_tokens_per_mb: 32768}
  optimizer: {type: adam, lr: 1.0e-06, weight_decay: 0.0, beta1: 0.9, beta2: 0.999, eps: 1.0e-8, lr_scheduler_type: constant, gradient_clipping: 1.0, warmup_steps_proportion: 0.0, warmup_steps: 0}
  temperature: 1.0
  discount: 1.0
  gae_lambda: 1.0
  critic_gae_lambda: 1.0
  reward_scaling: 1.0
  reward_bias: 0.0
  reward_norm: null
  adv_norm: null
  kl_ctl: 0.0
  overlong_reward_penalty: false
  ppo_n_minibatches: 1
  loss_reduction: token_mean
  use_direct_dis_loss: false
  rejection_sampling: null
  scheduling_spec:
    - {task_type: worker, port_count: 2, gpu: 1, cpu: 2, mem: 64, cmd: python3 -m areal.infra.rpc.rpc_server, env_vars: {}}

critic:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:TAU2_CRITIC_INIT_PATH}
  is_critic: true
  freeze_critic_attention: false
  value_contract: null
  init_from_scratch: false
  dtype: ${actor.dtype}
  optimizer_dtype: ${actor.optimizer_dtype}
  attn_impl: ${actor.attn_impl}
  disable_dropout: true
  gradient_checkpointing: true
  ppo_n_minibatches: 1
  loss_reduction: token_mean
  eps_clip: null
  mb_spec: {n_mbs: 1, max_tokens_per_mb: 32768}
  optimizer: {type: adam, lr: 5.0e-06, weight_decay: 0.0, beta1: 0.9, beta2: 0.999, eps: 1.0e-8, lr_scheduler_type: constant, gradient_clipping: 1.0, warmup_steps_proportion: 0.0, warmup_steps: 0}
  scheduling_strategy: {type: colocation, target: actor}
  scheduling_spec: ${actor.scheduling_spec}

ref: null
teacher: null
sglang:
  model_path: ${actor.path}
  random_seed: 42
  skip_tokenizer_init: true
  dtype: bfloat16
  context_length: 32768
  max_running_requests: 1
  mem_fraction_static: 0.75
vllm:
  model: ${actor.path}
  seed: 42
  skip_tokenizer_init: false
  dtype: bfloat16
  max_model_len: 32768
  gpu_memory_utilization: 0.8

train_dataset: {batch_size: 3, shuffle: false, pin_memory: true, num_workers: 0, path: sealed/train, type: rl, max_length: 32768, drop_last: false}
valid_dataset: {batch_size: 3, shuffle: false, pin_memory: true, num_workers: 0, path: sealed/dev, type: rl, max_length: 32768, drop_last: false}
saver:
  mode: sync
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 1
  freq_secs: null
recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 1
  freq_secs: null
evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 1
  freq_secs: null
  eval_before_train: true
stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb: {mode: disabled}
  swanlab: {mode: disabled}
  trackio: {mode: disabled}
perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: true
  save_interval: 1
  profile_steps: [0]
  session_tracer: {enabled: true, flush_threshold: 1}
